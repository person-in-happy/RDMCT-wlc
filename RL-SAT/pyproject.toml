[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdmct-rl-sat"
version = "0.1.0"
description = "SCIP-free structure-aware A3C, beam search, and CP-SAT scheduler for RDMCT-A3C"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "ortools>=9.10",
  "torch>=2.1"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["rl_sat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
